[workspace]
resolver = "2"
members = ["crates/vo-dsp", "crates/vo-audio", "crates/vo-cli", "crates/vo-eval", "crates/vo-gui"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# DeepFilterNet3 reference implementation (MIT OR Apache-2.0), pinned to a known commit.
# Built with the tract (pure-Rust) inference backend and the DFN3 model embedded in the binary.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

# tract is very slow in debug builds; always optimise dependencies.
[profile.dev.package."*"]
opt-level = 3
