[package]
name = "vo-dsp"
description = "Platform-independent voice-isolation DSP pipeline for Voiceolator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deep_filter.workspace = true
ndarray.workspace = true
anyhow.workspace = true
log.workspace = true
realfft = "3.3"
# ONNX Runtime bindings, used for the DPDFNet engine. `load-dynamic`: onnxruntime.dll /
# libonnxruntime.so is loaded at runtime from a path we choose (shipped next to the exe),
# so nothing is downloaded at build time and the toolchain (MSVC/MinGW) doesn't matter.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
