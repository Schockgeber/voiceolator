[package]
name = "vo-audio"
description = "Audio I/O host for Voiceolator: capture -> DSP -> output threads, device/app discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vo-dsp = { path = "../vo-dsp" }
anyhow.workspace = true
log.workspace = true
ringbuf = "0.4"
parking_lot = "0.12"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2.30", default-features = false }
libpulse-simple-binding = { version = "2.29", default-features = false }
libc = "0.2"
