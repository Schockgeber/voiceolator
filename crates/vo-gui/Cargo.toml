[package]
name = "vo-gui"
description = "Voiceolator desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "Voiceolator"
path = "src/main.rs"

[dependencies]
vo-dsp = { path = "../vo-dsp" }
vo-audio = { path = "../vo-audio" }
anyhow.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
parking_lot = "0.12"
hound = "3.5"
libc = "0.2"

[build-dependencies]
embed-resource = "3"
