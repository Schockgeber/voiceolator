[package]
name = "vo-cli"
description = "Voiceolator command-line prototype (Stage 3): capture an app, isolate the voice, play it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "voiceolator-cli"
path = "src/main.rs"

[dependencies]
vo-dsp = { path = "../vo-dsp" }
vo-audio = { path = "../vo-audio" }
anyhow.workspace = true
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
ctrlc = "3.4"
hound = "3.5"
vo-media = { path = "../vo-media" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
