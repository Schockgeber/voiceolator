# Builds, tests and packages Voiceolator for Windows and Linux.
# Pushing a tag like v0.11.0 also publishes a GitHub Release with all downloads.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: cargo test --release -p vo-dsp -p vo-audio -p vo-media -p vo-gui
      - name: Install NSIS and Python deps
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          pip install markdown
      - name: Package
        run: python tools/package.py --only windows --windows-target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libfuse2
      - name: Tests
        run: cargo test --release -p vo-dsp -p vo-audio -p vo-media -p vo-gui
      - name: Tools
        run: |
          pip install markdown ziglang
          cargo install cargo-zigbuild --locked
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Package
        run: python tools/package.py --only linux --appimagetool ./appimagetool --appimage-extract-and-run
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
